[package]
name = "clipshare"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Rodrigo Navarro <rnavarro@rnavarro.com.br>"]
description = "Share clipboard between machines on your local network"
categories = ["command-line-utilities"]
keywords = ["clipboard", "share"]
repository = "https://github.com/reu/clipshare"

[dependencies]
arboard = "3.6.1"
clap = { version = "4.6.1", features = ["derive"] }
rcgen = "0.14.8"
rustls = "0.23.40"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = "0.26.4"
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
dirs = "6.0.0"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
